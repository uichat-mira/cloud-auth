name: Temporary Cloud Auth bind hotfix
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/repair-cloud-auth-bind-20261024.yml
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Targeted Caddy bind repair with rollback
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 3m
          script: |
            set -eu
            caddyfile=/etc/caddy/Caddyfile
            snippet=/etc/caddy/mira-cloud-auth.caddy
            backup=/etc/caddy/mira-cloud-auth.caddy.before-bind-fix-20261024
            bind_ip="$(awk '/^mira-ai[.]tomzlab[.]cn[[:space:]]*[{]/ {inside=1; next} inside && /^[[:space:]]*bind[[:space:]]/ {print $2;exit} inside && /^}/ {exit}' "$caddyfile")"
            printf '%s' "$bind_ip" | grep -Eq '^[0-9]+(\\.[0-9]+){3}$' || { echo 'Cannot identify safe shared Caddy bind address'; exit 1; }
            echo '=== BEFORE: private-interface ingress ==='
            curl --noproxy '*' -sSi --resolve "cloud-auth.tomzlab.cn:443:$bind_ip" --max-time 8 "https://cloud-auth.tomzlab.cn/health" | head -16
            echo '=== BACKUP AND INSTALL ==='
            sudo -n test -r "$snippet"
            sudo -n cp -p "$snippet" "$backup"
            tmp="$(mktemp)"
            printf 'cloud-auth.tomzlab.cn {\n  bind %s\n  reverse_proxy 127.0.0.1:8788\n}\n' "$bind_ip" > "$tmp"
            sudo -n install -m 0644 "$tmp" "$snippet"
            rm -f "$tmp"
            if ! sudo -n caddy validate --config "$caddyfile" --adapter caddyfile; then
              sudo -n cp -p "$backup" "$snippet"
              echo 'Validation failed; restored route'
              exit 1
            fi
            if ! sudo -n systemctl reload caddy; then
              sudo -n cp -p "$backup" "$snippet"
              sudo -n systemctl reload caddy || true
              echo 'Reload failed; restored route'
              exit 1
            fi
            echo '=== AFTER: private-interface ingress ==='
            result="$(curl --noproxy '*' -fsS --resolve "cloud-auth.tomzlab.cn:443:$bind_ip" --max-time 8 "https://cloud-auth.tomzlab.cn/health" || true)"
            echo "$result"
            if test "$result" != '{"status":"ok","service":"mira-cloud-auth"}'; then
              sudo -n cp -p "$backup" "$snippet"
              sudo -n systemctl reload caddy || true
              echo 'Smoke check failed; restored route'
              exit 1
            fi
            echo '=== AFTER: DNS/public-IP ingress ==='
            public_result="$(curl --noproxy '*' -fsS --max-time 8 "https://cloud-auth.tomzlab.cn/health" || true)"
            echo "$public_result"
            if test "$public_result" != '{"status":"ok","service":"mira-cloud-auth"}'; then
              sudo -n cp -p "$backup" "$snippet"
              sudo -n systemctl reload caddy || true
              echo 'Public-IP smoke failed; restored route'
              exit 1
            fi
            echo '=== MIRA-AI NONREGRESSION ==='
            curl --noproxy '*' -sS -o /dev/null -w 'mira-ai http=%{http_code} verify=%{ssl_verify_result}\n' --resolve "mira-ai.tomzlab.cn:443:$bind_ip" --max-time 8 "https://mira-ai.tomzlab.cn/" || true
            echo 'CLOUD_AUTH_BIND_HOTFIX_SUCCESS'
