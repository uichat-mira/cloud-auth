name: Temporary Cloud Auth GET body diagnosis
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/diagnose-auth-body-20261024.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Same-client public GET comparison
        shell: bash
        run: |
          set +e
          for host in mira-ai.tomzlab.cn cloud-auth.tomzlab.cn; do
            echo "=== RUNNER PUBLIC GET $host ==="
            curl --noproxy '*' --http1.1 -sS -i -v --connect-timeout 4 --max-time 6 "https://$host/health" 2>&1 | tail -24 || true
          done
      - name: Server GET body and headers across API and Caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -u
            echo '=== API DIRECT GET ==='
            curl --noproxy '*' -sSi --http1.1 --max-time 6 http://127.0.0.1:8788/health || true
            echo
            for host in cloud-auth.tomzlab.cn mira-ai.tomzlab.cn; do
              echo "=== CADDY LOCAL GET $host ==="
              curl --noproxy '*' -sSi --http1.1 --max-time 6 --resolve "$host:443:127.0.0.1" "https://$host/health" || true
              echo
              echo "=== CADDY VIA PUBLIC IP GET $host ==="
              curl --noproxy '*' -sSi --http1.1 --max-time 6 --resolve "$host:443:8.138.2.174" "https://$host/health" || true
              echo
              echo "=== CADDY LOCAL HEAD $host ==="
              curl --noproxy '*' -sSI --http1.1 --max-time 6 --resolve "$host:443:127.0.0.1" "https://$host/health" || true
              echo
            done
            echo '=== HOST AND ROUTING ==='
            hostname
            echo 'LOCAL_NETWORK_INTERFACES'
            ip -4 -br addr show | sed -E 's/[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/x.x.x.x/g' | head -12
            ip4="$(getent ahostsv4 cloud-auth.tomzlab.cn | awk 'NR==1{print $1}')"
            if ip -o -4 addr show | grep -Fq "$ip4"; then echo 'DNS_IP_ASSIGNED_TO_HOST=yes'; else echo 'DNS_IP_ASSIGNED_TO_HOST=no (may be NAT)'; fi
            echo '=== SERVER CERTIFICATE IDENTITY BY ENTRY PATH ==='
            for host in cloud-auth.tomzlab.cn mira-ai.tomzlab.cn; do
              for target in 127.0.0.1 "$ip4"; do
                if test "$target" = 127.0.0.1; then echo "CERT host=$host entry=loopback"; else echo "CERT host=$host entry=public-ip"; fi
                timeout 7 openssl s_client -connect "$target:443" -servername "$host" </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256 -subject -issuer 2>&1 | head -4 || true
              done
            done
            echo '=== CADDY CONFIG SUMMARY ==='
            grep -nE 'mira-ai.tomzlab.cn|cloud-auth.tomzlab.cn|import|bind|respond|reverse_proxy|handle_path|handle ' /etc/caddy/Caddyfile | head -35 || true
