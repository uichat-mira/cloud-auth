name: Temporary Cloud Auth production T5
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/verify-auth-public-ingress-20261024.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact production deployment and NAT-facing GET
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            expected=6d0a2e1ebc5700f88fbb672b3ee0f85bb6539bf2
            actual="$(cat /opt/cloud-auth/.deployed-sha)"
            echo "DEPLOY_SHA=$actual"
            test "$actual" = "$expected"
            echo '=== PRODUCTION APP ==='
            app="$(curl --noproxy '*' -fsS --max-time 6 http://127.0.0.1:8788/health)"
            echo "$app"
            test "$app" = '{"status":"ok","service":"mira-cloud-auth"}'
            echo '=== PRODUCTION PUBLIC IP HTTPS ==='
            curl --noproxy '*' -sSi --max-time 8 --http1.1 https://cloud-auth.tomzlab.cn/health | head -15
            exposed="$(curl --noproxy '*' -fsS --max-time 8 https://cloud-auth.tomzlab.cn/health)"
            test "$exposed" = '{"status":"ok","service":"mira-cloud-auth"}'
            echo "PUBLIC_BODY_BYTES=${#exposed}"
            echo '=== CADDY BIND PRESERVED ==='
            grep -Eq '^[[:space:]]+bind[[:space:]]+[0-9]+(\\.[0-9]+){3}' /etc/caddy/mira-cloud-auth.caddy || cat /etc/caddy/mira-cloud-auth.caddy
            echo '=== MIRA-AI ROOT NONREGRESSION ==='
            curl --noproxy '*' -sS -o /dev/null -w 'mira-ai http=%{http_code} ssl=%{ssl_verify_result}\n' --max-time 8 https://mira-ai.tomzlab.cn/
            echo 'PRODUCTION_T5_PUBLIC_BIND_PASS'
