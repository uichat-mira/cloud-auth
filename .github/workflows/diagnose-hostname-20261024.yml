name: Temporary comparative HTTPS diagnosis
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Same-vantage external HTTPS comparison
        shell: bash
        run: |
          for host in mira-ai.tomzlab.cn cloud-auth.tomzlab.cn; do
            echo "=== EXTERNAL $host ==="
            getent ahostsv4 "$host" | head -1 || true
            curl --noproxy '*' -sS -I -v --connect-timeout 4 --max-time 8 "https://$host/health" 2>&1 | grep -E 'Connected to|HTTP/|TLS|SSL|Recv failure|reset|certificate|curl:|server certificate' | tail -18 || true
          done
      - name: Read-only Caddy and certificate comparison
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 3m
          script: |
            echo '=== TCP UDP LISTEN ==='
            sudo -n ss -lntup 2>/dev/null | grep -E '(:80 |:443 |:8788 )' | head -18 || true
            echo '=== LOCAL VERIFIED HTTPS ==='
            for host in mira-ai.tomzlab.cn cloud-auth.tomzlab.cn; do
              echo "HOST=$host"
              curl --noproxy '*' --resolve "$host:443:127.0.0.1" -sS -o /dev/null -w 'http=%{http_code} tls_verify=%{ssl_verify_result}\n' --connect-timeout 3 --max-time 6 "https://$host/health" 2>&1 || true
            done
            echo '=== CERTIFICATES ==='
            for host in mira-ai.tomzlab.cn cloud-auth.tomzlab.cn; do
              echo "HOST=$host"
              crt="/var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/$host/$host.crt"
              if test -r "$crt"; then openssl x509 -in "$crt" -noout -subject -issuer -dates -ext subjectAltName 2>&1 | head -15; else echo cert-not-readable; fi
            done
            echo '=== LOCAL TLS SNI VIA OPENSSL ==='
            for host in mira-ai.tomzlab.cn cloud-auth.tomzlab.cn; do
              echo "HOST=$host"
              printf '' | timeout 6 openssl s_client -connect 127.0.0.1:443 -servername "$host" -verify_return_error -brief 2>&1 | head -10 || true
            done
            echo '=== PUBLIC IP FROM SERVER ==='
            for host in mira-ai.tomzlab.cn cloud-auth.tomzlab.cn; do
              echo "HOST=$host"
              curl --noproxy '*' --resolve "$host:443:8.138.2.174" -sS -o /dev/null -w 'http=%{http_code} ssl=%{ssl_verify_result}\n' --connect-timeout 3 --max-time 7 "https://$host/health" 2>&1 || true
            done
