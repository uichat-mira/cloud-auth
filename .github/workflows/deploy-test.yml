# Test is intentionally runner-only: no host, SSH, Caddy, production secrets or shared ports.
name: Verify Cloud Auth Test (Isolated)

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-auth-test-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Isolated Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require test branch
        run: test "${GITHUB_REF}" = "refs/heads/test"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start disposable runtime on GitHub runner
        run: docker compose -p cloud-auth-test-ci up -d --build
      - name: Verify real API and packaged Portal
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8788/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -p cloud-auth-test-ci logs --tail=100
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8788/health |
            python3 -c 'import json,sys; body=json.load(sys.stdin); assert body.get("status")=="ok" and body.get("service")=="mira-cloud-auth", body'
          docker compose -p cloud-auth-test-ci exec -T cloud-auth test -s /app/apps/web/dist/index.html
          docker compose -p cloud-auth-test-ci exec -T cloud-auth grep -Fq "Mira Cloud Account" /app/apps/web/dist/index.html
      - name: Remove disposable runtime and data
        if: ${{ always() }}
        run: docker compose -p cloud-auth-test-ci down -v --remove-orphans
