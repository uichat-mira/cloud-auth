name: Deploy Cloud Auth Production

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build exact production image
        run: |
          set -euo pipefail
          docker build -t mira-cloud-auth:prod .
          docker save mira-cloud-auth:prod | gzip -1 > mira-cloud-auth-prod-image.tar.gz
          gzip -t mira-cloud-auth-prod-image.tar.gz

      - name: Prepare isolated production directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 2m
          script: |
            set -eu
            mkdir -p /opt/cloud-auth/data /opt/cloud-auth/backups /opt/cloud-auth/scripts /opt/cloud-auth/deploy
            chmod 700 /opt/cloud-auth/data /opt/cloud-auth/backups

      - name: Upload production bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "docker-compose.prod.yml,scripts/deploy-prod.sh,scripts/install-caddy-prod-route.sh,deploy/mira-cloud-auth-prod.caddy,mira-cloud-auth-prod-image.tar.gz"
          target: "/opt/cloud-auth"
          overwrite: true

      - name: Deploy, benchmark and local smoke
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 10m
          envs: DEPLOY_SHA
          script: |
            set -eu
            chmod +x /opt/cloud-auth/scripts/deploy-prod.sh /opt/cloud-auth/scripts/install-caddy-prod-route.sh
            /opt/cloud-auth/scripts/deploy-prod.sh

      - name: Public production smoke when DNS is live
        shell: bash
        run: |
          set -euo pipefail
          if ! getent ahostsv4 cloud-auth.tomzlab.cn >/dev/null 2>&1; then
            echo "::warning::cloud-auth.tomzlab.cn does not resolve yet; production runtime is deployed but public ingress smoke is pending DNS."
            exit 0
          fi

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 10 https://cloud-auth.tomzlab.cn/health; then
              exit 0
            fi
            sleep 5
          done

          echo "::warning::cloud-auth.tomzlab.cn resolves but this GitHub runner could not complete public HTTPS health. Server-local runtime/Caddy evidence remains authoritative for deployment; perform browser reachability acceptance separately."
          exit 0
