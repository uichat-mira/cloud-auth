name: Cloud Auth CI

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]

permissions:
  contents: read

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate

  t1:
    name: T1 Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  t2:
    name: T2 Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contract

  t3:
    name: T3 Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run build

  docker:
    name: Docker Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up -d --build
      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/ready; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Stop runtime
        if: ${{ always() }}
        run: docker compose down -v

  mira-gate:
    name: Mira Gate
    if: ${{ always() }}
    needs: [static, t1, t2, t3, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every merge gate
        env:
          STATIC: ${{ needs.static.result }}
          T1: ${{ needs.t1.result }}
          T2: ${{ needs.t2.result }}
          T3: ${{ needs.t3.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -eu
          for result in "$STATIC" "$T1" "$T2" "$T3" "$DOCKER"; do
            test "$result" = success
          done
