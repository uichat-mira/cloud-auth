name: Cloud Auth CI

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]

permissions:
  contents: read

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Diagnostic formatting diff (temporary)
        run: pnpm exec prettier apps/web/src/components/mobile-grant-row.tsx | diff -u apps/web/src/components/mobile-grant-row.tsx - || true
      - run: pnpm run format:check
      - run: pnpm audit --audit-level=moderate
      - name: Validate deployment scripts
        run: sh -n scripts/*.sh

  t1:
    name: T1 Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit

  t2:
    name: T2 Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contract

  t3:
    name: T3 Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration
      - run: pnpm run build
      - name: Argon2 V0 baseline benchmark
        run: pnpm run benchmark:argon2 3

  docker:
    name: Docker Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose -f docker-compose.test.yml config
      - run: docker compose -f docker-compose.prod.yml config
      - run: docker compose up -d --build
      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/ready; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Verify packaged Web artifact
        run: |
          docker compose exec -T cloud-auth test -s /app/apps/web/dist/index.html
          docker compose exec -T cloud-auth grep -Fq "Mira Cloud Account" /app/apps/web/dist/index.html
      - name: Stop runtime
        if: ${{ always() }}
        run: docker compose down -v

  mira-gate:
    name: Mira Gate
    if: ${{ always() }}
    needs: [static, t1, t2, t3, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every merge gate
        env:
          STATIC: ${{ needs.static.result }}
          T1: ${{ needs.t1.result }}
          T2: ${{ needs.t2.result }}
          T3: ${{ needs.t3.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -eu
          for result in "$STATIC" "$T1" "$T2" "$T3" "$DOCKER"; do
            test "$result" = success
          done
