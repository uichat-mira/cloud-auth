services:
  cloud-auth:
    image: mira-cloud-auth:prod
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      MIRA_AUTH_DB_PATH: /data/auth.sqlite
      LOG_LEVEL: info
      MIRA_AUTH_SESSION_TTL_SECONDS: 2592000
      MIRA_AUTH_PASSWORD_MAX_CONCURRENCY: 2
      MIRA_AUTH_LOGIN_PER_USERNAME_PER_MINUTE: 5
      MIRA_AUTH_LOGIN_PER_IP_PER_MINUTE: 20
      MIRA_AUTH_ARGON2_MEMORY_KIB: 19456
      MIRA_AUTH_ARGON2_PASSES: 2
      MIRA_AUTH_ARGON2_PARALLELISM: 1
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/data
      - ./backups:/backups
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
